services:
  pgsql:
    image: postgres:17
    container_name: pgsql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mundo_invest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mundo_invest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: mundo_invest-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      pgsql:
        condition: service_healthy

  tests:
    build: .
    env_file:
      - .env
    command: pytest -vv
    depends_on:
      pgsql:
        condition: service_healthy

volumes:
  postgres_data:
