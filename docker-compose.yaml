services:
  pgsql:
    image: postgres:17
    container_name: pgsql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mundo_invest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: mundo_invest-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - pgsql

volumes:
  postgres_data:
